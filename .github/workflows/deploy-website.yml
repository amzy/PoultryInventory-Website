name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-website:
    name: Deploy committed Website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public Website repository
        uses: actions/checkout@v4

      - name: Verify website
        run: |
          test -f index.html
          test -f CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
