name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '.deploy/source-trigger'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-website:
    name: Build and Deploy Website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public Website repository
        uses: actions/checkout@v4

      - name: Checkout private source repository
        uses: actions/checkout@v4
        with:
          repository: amzy/PoultryInventory
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: source
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Website artifact
        run: |
          printf 'www.ovaloasis.in\n' > source/website/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
